# First-stage fine-tune, sequence-packed, at max_lr 9.0e-5 -- the alternative
# to configs/train/sft_alpaca_packed.yaml, kept because the choice between the
# two is a genuine split rather than a settled question.
#
# Identical to that file except max_lr/min_lr. Everything it says about what
# packing changes, why 350 steps, and why the learning rate cannot be
# inherited applies here unchanged; only the conclusion differs.
#
# ---- What this one buys, and gives up ----
# Scored on both held-out sets (34 batches, matching every other number in
# README.md section 10.4):
#
#     stage 1                 Dolly    Alpaca     mean
#     3.0e-5                 2.8809    2.0431   2.4620
#     9.0e-5 (this file)     2.9230    1.9993   2.4612
#
#     final model             Dolly    Alpaca     mean
#     from 3.0e-5            2.7444    2.1237   2.4341
#     from 9.0e-5 (this)     2.7755    2.0768   2.4261
#     unpacked (shipped)     2.7707    2.1365   2.4536
#
# This config wins the mean of the two held-out sets, which is the tiebreak
# this project already uses elsewhere (see sft_dolly.yaml). It loses on Dolly,
# where it is fractionally worse than the unpacked pipeline it replaces
# (2.7755 against 2.7707) even though its mean is clearly better.
#
# The whole of its advantage on the mean is Alpaca loss it did not lose during
# stage 2. Read one way that is a better-preserved model; read another it is
# just a model stage 2 moved less, which is the relocation effect documented in
# section 10.4 rather than a real gain. Both readings fit the numbers, so both
# configs ship and section 10.6 states the trade instead of hiding it behind a
# single default.
#
batch_size: 8
seq_len: 512
grad_accum_steps: 4
max_steps: 350
warmup_steps: 22
max_lr: 9.0e-5
min_lr: 9.0e-6
weight_decay: 0.1
betas: [0.9, 0.95]
grad_clip: 1.0
log_interval: 1
eval_interval: 50
eval_steps: 40
checkpoint_interval: 175
amp_dtype: float16
gradient_checkpointing: false
use_efficient_attention: true
pack_sequences: true
# Irrelevant here -- InstructionDataset emits whole examples, not windows over
# a stream -- but TrainConfig requires the field to be explicit or None.
stride: null
num_workers: 3
pin_memory: true
compile_model: false
seed: 1337
