# SUPERSEDED by configs/train/sft_dolly.yaml. Kept because this is the run
# whose prediction was wrong, and the reasoning below is the wrong reasoning,
# preserved verbatim: it argued for one epoch by analogy with the Alpaca
# stage, and Dolly's validation loss fell at every eval of this run and was
# still falling at step 470 (2.8237). Two and three-epoch runs went lower.
# The measurements are in logs/sft_dolly_1epoch.csv and README.md section 10.
#
# Second-stage fine-tune: a short pass over Dolly 15k after the Alpaca run.
#
# Dolly is human-written where Alpaca is machine-generated, so this stage is
# about answer *quality* rather than teaching the response format -- Alpaca
# already did that. It runs at half the learning rate.
#
# ---- Why one epoch, not the ~3 the Alpaca recipe uses ----
# The Alpaca stage put its validation minimum at step 1,500 against an epoch
# length of 1,590, and val loss rose on every eval after it: this model
# overfits an instruction set in a single pass. Dolly is 14,034 usable
# examples (6.5% of the 15,011 exceed the 512-token window and are dropped,
# against 0.1% for Alpaca -- Dolly's human-written context fields are long),
# and 2% of those are held out, so an epoch over the 13,756 training examples
# is ~430 steps and a second pass would repeat a set a third the size of the
# one that already overfit. 470 steps is one epoch plus a little.
# Evals and checkpoints are more frequent than the Alpaca stage because the
# whole run is now shorter than that stage's checkpoint interval.
#
# ---- Which Alpaca checkpoint this starts from ----
# checkpoints/sft_alpaca/step_1500.pt, not the end of that run. Two reasons.
# Step 1,500 is where Alpaca's validation loss bottomed out (2.0793); every
# later checkpoint is measurably further into memorizing Alpaca, and there is
# no reason to hand this stage a worse starting point. And the true final
# weights (step 4,875) do not exist: that run's max_steps was not a multiple
# of its 500-step checkpoint interval, and the trainer only saved on the
# interval, so the last file on disk is step_4500.pt. That is fixed now, but
# not retroactively.
#
# Runs on one RTX 2080 Ti, launched by scripts/finetune.py, not
# scripts/train.py: the data is prompt/response pairs with the prompt masked
# out of the loss, not a continuous token stream.
#
# ---- Why the learning rate is 1.0e-5 ----
# Pretraining ran at max_lr 6.0e-4 from random initialization, where large
# steps are what you want; the Alpaca stage dropped to 2.0e-5, the usual SFT
# range for a model this size, because it started from weights that already
# encoded English and only needed to change behaviour. This stage halves that
# again. It is not teaching the response format -- Alpaca already did, and
# the model arrives here already producing it -- so the smallest step that
# still moves answer quality is the right one. The risk being bought off is
# that a third pass at full SFT strength over a 14k set drags the model into
# Dolly's idiom without teaching it anything new.
#
# ---- Batch arithmetic ----
# 8 * 4 * 1 * 512 = 16,384 tokens/step, ~32 examples per optimizer step --
# identical to the Alpaca stage, so the two stages differ in data and
# learning rate and nothing else. 13,756 usable training examples means an
# epoch is ~430 steps. Note the *supervised* token count is much lower than
# 16,384: prompts are masked, so only response tokens produce gradient.
#
# ---- Memory ----
# Same batch_size as pretraining (8): the fp32 logits tensor is what bounds
# this on 11GB and it is unchanged at 8 * 512 * 50304 * 4 = 0.82GB. Padding
# to a fixed 512 keeps the shape identical to the pretraining run, so the
# measured 6.01GB peak carries over.
batch_size: 8
seq_len: 512
grad_accum_steps: 4
max_steps: 470
warmup_steps: 50
max_lr: 1.0e-5
min_lr: 1.0e-6
weight_decay: 0.1
betas: [0.9, 0.95]
grad_clip: 1.0
log_interval: 1
eval_interval: 100
eval_steps: 40
checkpoint_interval: 150
amp_dtype: float16
gradient_checkpointing: false
use_efficient_attention: true
# Irrelevant here -- InstructionDataset emits whole examples, not windows over
# a stream -- but TrainConfig requires the field to be explicit or None.
stride: null
num_workers: 3
pin_memory: true
compile_model: false
seed: 1337
