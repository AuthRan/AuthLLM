# Training preset for the `small` (~30M) model on a TinyStories subset,
# tuned for Kaggle's 2x T4 (16GB each) launched via `torchrun --nproc_per_node=2`.
#
# T4 is Turing: it has fast fp16 but NO native bf16, so amp_dtype is float16
# (not the bfloat16 default used elsewhere). use_efficient_attention routes to
# the fused scaled-dot-product kernel -- a real speed/memory win on GPU.
#
# Tokens/step = batch_size * grad_accum_steps * nproc_per_node * seq_len
#             = 24 * 4 * 2 * 512 ~= 98k tokens/step.
# On a ~100-150MB TinyStories subset (~30M tokens) that's ~300 steps/epoch;
# 6000 steps ~= 20 epochs. Watch val loss and cut max_steps if it overfits
# (small subset) or raise it if you feed more data.
batch_size: 24
seq_len: 512
grad_accum_steps: 4
max_steps: 6000
warmup_steps: 300
max_lr: 6.0e-4
min_lr: 6.0e-5
weight_decay: 0.1
betas: [0.9, 0.95]
grad_clip: 1.0
log_interval: 50
eval_interval: 250
eval_steps: 20
checkpoint_interval: 500
amp_dtype: float16
gradient_checkpointing: false
use_efficient_attention: true
seed: 1337
