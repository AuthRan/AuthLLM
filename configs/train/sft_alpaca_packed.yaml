# First-stage fine-tune, sequence-packed: one pass over Alpaca 52k in 350
# steps instead of 1,600, at a quarter of the wall clock and a better model at
# the end of the pipeline.
#
# Identical to configs/train/sft_alpaca.yaml except for pack_sequences,
# max_steps, warmup_steps and max_lr -- the last three all follow from the
# first, which is the whole point of this file's existence as a separate
# config rather than a flag flipped on the old one.
#
# ---- What packing changes ----
# Every example was padded to a full 512-token window: ~78% of each step was
# padding, another ~11% was prompt masked out of the loss, so ~89% of the
# compute produced no gradient. Packing lays whole examples end to end and
# masks attention at the boundaries (see ashugpt/data/instruction.py's
# PackedInstructionDataset and README.md section 10.6). Alpaca's 50,868
# usable examples become 11,220 windows at 98.8% fill -- 4.5x fewer forward
# passes for the same data.
#
# Measured: 4.40x the supervised tokens/second for 1.02x the per-step cost
# and +0.07GB peak (scripts/benchmark_packing.py). The block-diagonal mask is
# the only new cost and it is nearly free.
#
# ---- Why 350 steps ----
# One epoch. 11,220 windows / (8 * 4 per step) = ~350. The unpacked stage
# needed 1,600 for the same single pass; this is the same data seen once, in
# 4.5x fewer and correspondingly larger steps. The one-epoch choice itself is
# inherited and was measured on the unpacked lineage -- see sft_alpaca.yaml.
#
# ---- Why max_lr is 3.0e-5, not 2.0e-5 ----
# Because a packed step carries 4.5x the supervised tokens, the learning rate
# does not carry over. At the inherited 2e-5 packing is *worse* than not
# packing (2.0912 against 2.0745 on Alpaca held-out) -- the throughput win is
# real and the quality regresses, purely because the schedule was silently
# rescaled. Swept, Alpaca held-out loss at step 350:
#
#     2.0e-5   2.0912      6.0e-5   2.0352
#     3.0e-5   2.0678      9.0e-5   2.0217
#     4.2e-5   2.0505      1.5e-4   2.0175
#
# That column keeps falling to 1.5e-4 and 3.0e-5 is nowhere near its best. It
# is chosen on a different question: how the *pipeline* ends up. Scored on
# Dolly held-out -- data no stage trains on -- the ranking inverts, because
# past ~3e-5 the extra learning rate stops teaching instruction-following and
# starts driving the model into Alpaca's specific distribution, which Alpaca's
# own held-out set is structurally unable to see:
#
#     stage 1        Dolly    Alpaca     mean
#     3.0e-5        2.8809    2.0431   2.4620
#     9.0e-5        2.9230    1.9993   2.4612
#     1.5e-4        2.9690    1.9958   2.4824   (worse than the unpacked stage)
#     unpacked 2e-5 2.9145    2.0512   2.4829
#
# ---- Why this config and sft_alpaca_packed_9e5.yaml both exist ----
# 3.0e-5 and 9.0e-5 are tied to 0.0008 on the mean, which is noise, and running
# the identical stage 2 off each does not break the tie so much as expose what
# it is made of:
#
#     final model              Dolly    Alpaca     mean
#     from 3.0e-5             2.7444    2.1237   2.4341
#     from 9.0e-5             2.7755    2.0768   2.4261
#     unpacked (shipped)      2.7707    2.1365   2.4536
#
# Both beat the unpacked pipeline. 3.0e-5 gives the best Dolly loss anything in
# this repo has reached; 9.0e-5 gives the best mean, and this project's
# existing tiebreak is the mean (see sft_dolly.yaml). But 9.0e-5's edge on the
# mean is entirely its retained Alpaca loss -- stage 2 moves it less -- which is
# the "stage 2 relocates the model rather than improving it" effect already
# documented, not evidence of a better assistant. That argument is also
# suspiciously convenient, so the split is documented rather than resolved:
# this file is the default because Dolly is the distribution stage 2 exists to
# fit, and sft_alpaca_packed_9e5.yaml is kept beside it with its own numbers.
# See README.md section 10.6.
#
# The unpacked schedule was swept too, to rule out the obvious confound that
# these gains were just a badly tuned baseline: it peaks at 3e-5 (2.0720) and
# turns by 6e-5 (2.0973), so the 2e-5 it shipped was about right. The two
# optima sit ~5x apart against a 4.53x batch ratio -- linear scaling, not the
# square-root rule that is the usual first guess and would have stopped less
# than halfway.
#
# ---- Everything else ----
# warmup_steps scales with the schedule (100/1600 -> 22/350). Batch shape,
# amp, and attention settings are untouched: packing changes what is *in* the
# window, not its shape, so the measured 6.01GB peak still carries over.
batch_size: 8
seq_len: 512
grad_accum_steps: 4
max_steps: 350
warmup_steps: 22
max_lr: 3.0e-5
min_lr: 3.0e-6
weight_decay: 0.1
betas: [0.9, 0.95]
grad_clip: 1.0
log_interval: 1
eval_interval: 50
eval_steps: 40
checkpoint_interval: 175
amp_dtype: float16
gradient_checkpointing: false
use_efficient_attention: true
pack_sequences: true
# Irrelevant here -- InstructionDataset emits whole examples, not windows over
# a stream -- but TrainConfig requires the field to be explicit or None.
stride: null
num_workers: 3
pin_memory: true
compile_model: false
seed: 1337
