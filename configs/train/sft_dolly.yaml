# Second-stage fine-tune: a pass over Dolly 15k after the Alpaca stage.
#
# Dolly is human-written where Alpaca is machine-generated, so this stage is
# about answer *quality* rather than teaching the response format -- Alpaca
# already did that.
#
# ---- Why 940 steps (~2 epochs) ----
# Measured, not assumed, and the first guess was wrong. The original version
# of this config ran 470 steps (~1 epoch), reasoning by analogy: the Alpaca
# stage overfit inside a single pass, so a second pass over a set a quarter
# the size should overfit harder. Dolly's validation loss instead fell at
# every single eval of that run and was still falling when it ended. Three
# lengths were then run, each a complete cosine cycle down to min_lr so that
# their endpoints compare fairly:
#
#     470 steps   (1 epoch)   best val 2.8237  (still falling at the end)
#     940 steps   (2 epochs)  best val 2.8038  at step 900
#     1,410 steps (3 epochs)  best val 2.7969  at step 1,300
#
# Longer is monotonically better on Dolly -- but Dolly validation loss is not
# the only thing moving. Scored on *Alpaca's* held-out split, those same three
# checkpoints go 2.1211 -> 2.1311 -> 2.1427: every Dolly epoch buys Dolly loss
# and pays for it in Alpaca loss at close to 1:1. This stage is not making the
# model better, it is moving where the model is good. 940 steps is the minimum
# of the average of the two held-out losses, which is the least arbitrary
# place to stop given that trade. See README.md section 10 and
# results/instruction-tuning.md; the sweep runs are kept beside this file as
# configs/train/sft_dolly_1epoch.yaml, sft_dolly_2epoch.yaml and
# sft_dolly_3epoch.yaml.
#
# ---- Which Alpaca checkpoint this starts from ----
# checkpoints/sft_alpaca/step_1600.pt -- the end of the one-epoch stage-1
# run. It is the best stage-1 checkpoint on Alpaca's held-out split (2.0512),
# second best on Dolly's (2.9145, behind the long run's step 500 at 2.9049),
# and the best of them by the mean of the two. Starting here rather than from
# the 3-epoch run's best checkpoint is worth 0.028 nats at the end of this
# stage: 2.7707 against 2.7988, for the same 940 steps.
#
# The schedule sweep above was run on the older stage-1 lineage, before that
# was known. Its conclusion carried over unchanged -- the curve on this
# lineage has the same shape and the same minimum, bottoming at step 900
# (2.7759) and ticking up by 940 -- so it was not re-run.
#
# ---- Why the learning rate is 1.0e-5 ----
# Pretraining ran at max_lr 6.0e-4 from random initialization, where large
# steps are what you want; the Alpaca stage dropped to 2.0e-5, the usual SFT
# range for a model this size, because it started from weights that already
# encoded English and only needed to change behaviour. This stage halves that
# again. It is not teaching the response format -- Alpaca already did, and
# the model arrives here already producing it -- so the smallest step that
# still moves answer quality is the right one. The risk being bought off is
# that a third pass at full SFT strength over a 14k set drags the model into
# Dolly's idiom without teaching it anything new.
#
# ---- Batch arithmetic ----
# 8 * 4 * 1 * 512 = 16,384 tokens/step, ~32 examples per optimizer step --
# identical to the Alpaca stage, so the two stages differ in data and
# learning rate and nothing else. 13,756 usable training examples means an
# epoch is ~430 steps, so this config is ~2.2 of them. Note the *supervised*
# token count is much lower than 16,384: prompts are masked, so only response
# tokens produce gradient -- about 11% of each step's positions, measured.
#
# ---- Memory ----
# Same batch_size as pretraining (8): the fp32 logits tensor is what bounds
# this on 11GB and it is unchanged at 8 * 512 * 50304 * 4 = 0.82GB. Padding
# to a fixed 512 keeps the shape identical to the pretraining run, so the
# measured 6.01GB peak carries over.
batch_size: 8
seq_len: 512
grad_accum_steps: 4
max_steps: 940
warmup_steps: 50
max_lr: 1.0e-5
min_lr: 1.0e-6
weight_decay: 0.1
betas: [0.9, 0.95]
grad_clip: 1.0
log_interval: 1
eval_interval: 100
eval_steps: 40
checkpoint_interval: 235
amp_dtype: float16
gradient_checkpointing: false
use_efficient_attention: true
# Irrelevant here -- InstructionDataset emits whole examples, not windows over
# a stream -- but TrainConfig requires the field to be explicit or None.
stride: null
num_workers: 3
pin_memory: true
compile_model: false
seed: 1337
